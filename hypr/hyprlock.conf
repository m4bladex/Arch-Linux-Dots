# Source Pywal colors
source = ~/.cache/wal/colors-hyprland.conf

# Background
background {
    monitor =
    path = ~/.config/rofi/.current_wallpaper
    blur_passes = 2
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
}

# Clock Label
label {
    monitor =
    text = cmd[update:1000] echo "$TIME"
    color = $foreground
    font_size = 90
    font_family = Fira Code SemiBold
    position = 0, 150
    halign = center
    valign = center
    shadow_passes = 2
}

# Input Field
input-field {
    monitor =
    size = 300, 60
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = $color1
    inner_color = $background
    font_color = $foreground
    fade_on_empty = false
    placeholder_text = <span foreground="##cdd6f4">use me ;)</span>
    hide_input = false
    position = 0, -50
    halign = center
    valign = center
}
